<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="sky2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="180" fill="#ffffff"/>

  <!-- animated wave at top -->
  <path fill="url(#sky2)" opacity="0.18">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,55 C200,15 400,95 600,55 C800,15 1000,95 1200,55 L1200,0 L0,0 Z;
        M0,55 C220,95 420,10 620,55 C820,100 980,20 1200,55 L1200,0 L0,0 Z;
        M0,55 C200,15 400,95 600,55 C800,15 1000,95 1200,55 L1200,0 L0,0 Z
      " />
  </path>

  <text x="600" y="110" text-anchor="middle"
        fill="#334155"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
        font-size="14">
    knew-stm.de - knewstm.dev - knewstm.tech - knewsworld.de
  </text>
</svg>
