<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.6" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="240" fill="#ffffff"/>

  <!-- soft blobs -->
  <circle cx="220" cy="70" r="95" fill="url(#sky)" opacity="0.28" filter="url(#soft)"/>
  <circle cx="980" cy="120" r="115" fill="url(#sky)" opacity="0.22" filter="url(#soft)"/>

  <!-- animated wave band -->
  <path fill="url(#sky)" opacity="0.20">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,165 C180,210 360,120 540,165 C720,210 900,120 1200,165 L1200,240 L0,240 Z;
        M0,165 C220,120 380,215 560,165 C740,115 920,210 1200,165 L1200,240 L0,240 Z;
        M0,165 C180,210 360,120 540,165 C720,210 900,120 1200,165 L1200,240 L0,240 Z
      " />
  </path>

  <text x="70" y="118"
        fill="#0f172a"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
        font-size="44"
        font-weight="800">knew.stm</text>

  <text x="70" y="152"
        fill="#334155"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
        font-size="16">knew-stm.de</text>
</svg>
